spring.application.name=JobSearchCompanion
server.address=127.0.0.1

# Boot 4 uses spring.mongodb.uri. Explicit replicaSet enables transaction discovery.
# Override with MONGODB_URI when connecting to a different local environment.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/job_search_companion?replicaSet=rs0&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}
